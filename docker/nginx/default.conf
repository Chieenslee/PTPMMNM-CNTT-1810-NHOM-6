# ==============================================================================
# XANH HUB (ĐỀ TÀI 6) - PRODUCTION NGINX CONFIGURATION
# Reverse Proxy, Gzip Level 6, Rate Limit Auth & Static Cache
# ==============================================================================

# Rate limit mapping based on query parameter 'action'
map $arg_action $auth_rate_limit_key {
    default "";
    "do_login"       $binary_remote_addr;
    "oauth_login"    $binary_remote_addr;
    "do_register"    $binary_remote_addr;
}

# Rate limit zone: 10MB memory (~160,000 IPs), 10 requests per minute
limit_req_zone $auth_rate_limit_key zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # SSL & HTTP/2 readiness (uncomment when TLS certificates are mounted)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # --------------------------------------------------------------------------
    # 1. Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # 2. Optimized Buffer Sizes
    # --------------------------------------------------------------------------
    client_max_body_size 32M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 3. Gzip Compression (Level 6)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        font/woff
        font/woff2
        font/ttf
        font/eot;

    # --------------------------------------------------------------------------
    # 4. Healthcheck Location
    # --------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # 5. Static File Serving with Long-Term Cache (30 Days)
    # --------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 6. URL Rewrite & Front Controller Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 7. PHP-FPM FastCGI Reverse Proxy with Rate Limiting
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        # Rate limiting on authentication actions
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        # FastCGI buffer sizes
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }
}
